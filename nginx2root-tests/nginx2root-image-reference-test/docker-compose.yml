services:
  # Vulnerable: nginx 1.26.2 with HTTP/3 (listen ... quic) in the mounted configuration
  proxy:
    image: nginx:1.26.2
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  # Vulnerable: unprivileged image
  proxy-unprivileged:
    image: nginxinc/nginx-unprivileged:1.27.0-alpine
  app:
    image: python:3.13-slim
