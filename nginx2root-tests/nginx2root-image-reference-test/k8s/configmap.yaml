# Turns on HTTP/2: the precondition for every 005043 finding in this repository
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  default.conf: |
    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        location / {
            proxy_pass http://app:8080;
        }
    }
