apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        # Vulnerable: nginx 1.27.3
        - name: nginx
          image: nginx:1.27.3-alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
        # Vulnerable: mirrored official image, minor tag of an old branch
        - name: nginx-ecr
          image: "public.ecr.aws/nginx/nginx:1.28"
        # Not reported: commented out
        # - name: old
        #   image: nginx:1.24.0
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
